# Odoo 18 Community + PostgreSQL 16 (see docs/adr/0005-tech-stack-and-delivery.md)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - db-data:/var/lib/postgresql/data

  odoo:
    image: odoo:18.0
    depends_on:
      - db
    ports:
      - "8069:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      # The repo root is the addons folder, so Odoo finds room_booking/ directly.
      - ./:/mnt/extra-addons
      - odoo-data:/var/lib/odoo
    # Create the "booking" database and install (or update) the module on start.
    command: odoo -d booking -i room_booking --db-filter=^booking$$

volumes:
  db-data:
  odoo-data:
